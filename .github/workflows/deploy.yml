name: Deploy to Azure

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Login to Azure Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: murajaregistry.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@4f58ea79220b3da1e31ca2d3a3fc5e6a5d9f1c45
        with:
          context: .
          push: true
          tags: |
            murajaregistry.azurecr.io/muraja-monitor:latest
            murajaregistry.azurecr.io/muraja-monitor:${{ github.sha }}
          cache-from: type=registry,ref=murajaregistry.azurecr.io/muraja-monitor:latest
          cache-to: type=inline

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8
        with:
          image-ref: murajaregistry.azurecr.io/muraja-monitor:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Login to Azure
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1 # TODO: pin to commit SHA
        with:
          containerAppName: muraja-monitor
          resourceGroup: muraja-monitor-rg
          imageToDeploy: murajaregistry.azurecr.io/muraja-monitor:${{ github.sha }}

      - name: Run migrations
        run: |
          az containerapp exec \
            --name muraja-monitor \
            --resource-group muraja-monitor-rg \
            --command "php artisan migrate --force"
