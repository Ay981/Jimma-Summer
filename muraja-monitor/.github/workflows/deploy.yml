name: Deploy to Azure

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: murajaregistry.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            murajaregistry.azurecr.io/muraja-monitor:latest
            murajaregistry.azurecr.io/muraja-monitor:${{ github.sha }}
          cache-from: type=registry,ref=murajaregistry.azurecr.io/muraja-monitor:latest
          cache-to: type=inline

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: muraja-monitor
          resourceGroup: muraja-monitor-rg
          imageToDeploy: murajaregistry.azurecr.io/muraja-monitor:${{ github.sha }}

      - name: Run migrations
        run: |
          az containerapp exec \
            --name muraja-monitor \
            --resource-group muraja-monitor-rg \
            --command "php artisan migrate --force"
