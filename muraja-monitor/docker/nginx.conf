worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    gzip on;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json;

    server {
        listen 80;
        root /var/www/public;
        index index.php;
        server_tokens off;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
        # NOTE: HSTS is only effective when served over HTTPS. Ensure TLS terminates at vps-nginx.conf.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # script-src + www.gstatic.com: the FCM service worker importScripts() the Firebase compat SDK from gstatic.
        # connect-src + *.googleapis.com: getToken() registers/refreshes the web push token against FCM (fcmregistrations/firebaseinstallations/fcm.googleapis.com).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.googleapis.com; frame-ancestors 'none';" always;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_read_timeout 60;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location ~ /\.ht { deny all; }
        location ~ /\.env { deny all; }
    }
}
